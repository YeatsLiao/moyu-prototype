<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>历史战绩 · 摸鱼战绩计算器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="history">
<div class="stage"><div class="phone"><div class="screen">
  <main class="page">
    <div class="statusbar"><span>9:41</span><span class="capsule">摸鱼中 ···</span></div>

    <div class="page-head rise"><h1>战绩</h1></div>

    <div class="card level-card rise">
      <div class="tape"></div>
      <div class="lv-icon" id="lvIcon"></div>
      <div style="flex:1;min-width:0;">
        <div class="lv-name" id="lvName">摸鱼新手</div>
        <div class="lv-range" id="lvTotal">¥0 / ¥10</div>
        <div class="bar"><i id="lvBar" style="width:0%"></i></div>
      </div>
      <button class="lv-info" id="btnLvInfo" title="等级说明">?</button>
    </div>

    <!-- 日 / 周 / 月 -->
    <div class="seg seg-sm range-seg rise" id="rangeSeg">
      <button data-range="day">日</button>
      <button data-range="week">周</button>
      <button data-range="month">月</button>
    </div>

    <div class="stat-row rise">
      <div class="stat"><div class="s-v" id="mHours">0<small>h</small></div><div class="s-k">时长</div></div>
      <div class="stat"><div class="s-v hi" id="mMoney">¥0</div><div class="s-k">收益</div></div>
      <div class="stat"><div class="s-v" id="mCups">0<small>杯</small></div><div class="s-k">奶茶</div></div>
    </div>

    <div class="cmp rise" id="cmpLine"></div>

    <!-- 月历 -->
    <div class="cal rise">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" aria-label="上个月">‹</button>
        <div class="cal-title" id="calTitle">10月<small>本月</small></div>
        <button class="cal-nav" id="calNext" aria-label="下个月" disabled>›</button>
      </div>
      <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend"><i class="lg1"></i><i class="lg2"></i><i class="lg3"></i><span>摸得越多越黄</span></div>
    </div>

    <div class="card cal-detail rise" id="calDetail"></div>
  </main>

  <!-- 等级说明 -->
  <div class="modal-mask" id="lvModal">
    <div class="modal modal-wide">
      <div class="tape"></div>
      <h3>等级说明</h3>
      <div class="lv-list" id="lvList"></div>
      <div class="m-actions" style="margin-top:14px;">
        <button class="btn-big secondary" id="lvClose">知道了</button>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab" data-nav="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg><span>首页</span></a>
    <a class="tab" data-nav="history" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span>历史</span></a>
    <a class="tab" data-nav="settings" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg><span>设置</span></a>
  </nav>
</div></div></div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
