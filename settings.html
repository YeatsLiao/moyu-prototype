<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>摸鱼战绩计算器 · 设置</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="settings">
<div class="stage"><div class="phone"><div class="screen">
  <main class="page">
    <div class="statusbar"><span>9:41</span><span class="capsule">摸鱼战绩计算器 ···</span></div>

    <div class="page-head rise"><h1>设置</h1><span class="date">薪资 · 工时</span></div>

    <div class="field rise">
      <div class="f-lbl">月薪（税前）<span class="req">必填 · 摸鱼身价的根基</span></div>
      <div class="input-wrap"><input id="fSalary" type="number" inputmode="decimal" placeholder="例如 10000"><span class="unit">元 / 月</span></div>
    </div>

    <div class="field rise">
      <div class="f-lbl">每日工作时长</div>
      <div class="input-wrap"><input id="fHours" type="number" inputmode="decimal" placeholder="例如 8"><span class="unit">小时 / 天</span></div>
    </div>

    <div class="field rise">
      <div class="f-lbl">工作制度（决定月计薪天数）</div>
      <div class="seg" id="schemeSeg">
        <button data-scheme="double">双休<span class="s-sub">21.75 天</span></button>
        <button data-scheme="bigsm">大小周<span class="s-sub">23.75 天</span></button>
        <button data-scheme="single">单休<span class="s-sub">25.75 天</span></button>
      </div>
    </div>

    <!-- 身价预览 -->
    <div class="card rate-card rise">
      <div class="lbl">你的摸鱼身价</div>
      <div class="r-main neon-text" id="rHour">¥ --</div>
      <div class="r-sub" id="rMinute"></div>
    </div>

    <div class="home-actions rise">
      <button class="btn-big btn-start" id="saveBtn">保存配置</button>
    </div>

    <div class="privacy rise">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>所有数据仅存储在本机，不上传服务器。薪资是打工人的最高机密，我们懂。修改配置只影响之后的计时，历史战绩不翻旧账。</span>
    </div>
  </main>

  <nav class="tabbar">
    <a class="tab" data-nav="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg><span>首页</span></a>
    <a class="tab" data-nav="history" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span>历史</span></a>
    <a class="tab" data-nav="settings" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg><span>设置</span></a>
  </nav>
</div></div></div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
