<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>设置 · 摸鱼战绩计算器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="settings">
<div class="stage"><div class="phone"><div class="screen">
  <main class="page">
    <div class="statusbar"><span>9:41</span><span class="capsule">摸鱼中 ···</span></div>

    <div class="page-head rise"><h1>设置</h1></div>

    <div class="field rise">
      <div class="f-lbl">月薪</div>
      <div class="input-wrap"><input id="fSalary" type="number" inputmode="decimal" placeholder="10000"><span class="unit">元</span></div>
    </div>

    <div class="field rise">
      <div class="f-lbl">工时</div>
      <div class="input-wrap"><input id="fHours" type="number" inputmode="decimal" placeholder="8"><span class="unit">小时 / 天</span></div>
    </div>

    <div class="field rise">
      <div class="f-lbl">工作制度</div>
      <div class="seg" id="schemeSeg">
        <button data-scheme="double">双休</button>
        <button data-scheme="bigsm">大小周</button>
        <button data-scheme="single">单休</button>
      </div>
    </div>

    <div class="card rate-card rise">
      <div class="r-main" id="rHour">¥ --</div>
      <div class="r-sub" id="rMinute"></div>
    </div>

    <button class="btn-ghost rise" id="btnPrice" style="margin-top:14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      物品价格一览
    </button>

    <div class="home-actions rise">
      <button class="btn-big btn-start" id="saveBtn">保存</button>
    </div>
  </main>

  <nav class="tabbar">
    <a class="tab" data-nav="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg><span>首页</span></a>
    <a class="tab" data-nav="history" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span>历史</span></a>
    <a class="tab" data-nav="settings" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg><span>设置</span></a>
  </nav>
</div></div></div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
