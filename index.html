<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>摸鱼战绩计算器 · 首页</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
<div class="stage"><div class="phone"><div class="screen">
  <main class="page">
    <div class="statusbar"><span>9:41</span><span class="capsule">摸鱼战绩计算器 ···</span></div>

    <div class="page-head rise">
      <h1>摸鱼战绩计算器</h1>
      <span class="date" id="headDate"></span>
    </div>

    <!-- 今日总览 -->
    <div class="card today-panel rise">
      <div class="t-lbl"><span class="live-dot"></span><span class="lbl" id="liveLbl">今日摸鱼总时长</span></div>
      <div class="t-time" id="tTime">00:00:00</div>
      <div class="lbl">今日已赚（老板出血中）</div>
      <div class="t-money neon-text" id="tMoney">¥ 0.00</div>
      <div class="t-eq" id="tEq">≈ <b>还差一点点就能换鸡腿</b></div>
      <div class="session-tag" id="sessionTag" style="display:none;"><span></span></div>
    </div>

    <!-- 摸鱼类型 -->
    <div class="sec-title rise">选择摸鱼赛道</div>
    <div class="type-grid rise" id="typeGrid"></div>

    <!-- 大按钮 -->
    <div class="home-actions rise">
      <button class="btn-big btn-start" id="mainBtn">▶ 开始摸鱼</button>
      <a class="btn-ghost" href="share.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
        生成今日战报
      </a>
      <div class="home-tip">计时数据仅保存在本机，老板看不见 · 摸鱼不丢人，白加班才丢人</div>
    </div>
  </main>

  <!-- 结算弹窗 -->
  <div class="modal-mask" id="settleModal">
    <div class="modal">
      <h3>本次摸鱼结算</h3>
      <div class="m-time" id="mTime">00:00:00</div>
      <div class="m-money neon-text" id="mMoney">¥ 0.00</div>
      <div class="m-quip" id="mQuip"></div>
      <div class="m-actions">
        <button class="btn-big secondary" id="mClose">知道了</button>
        <a class="btn-big btn-start" href="share.html">生成战报</a>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab" data-nav="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg><span>首页</span></a>
    <a class="tab" data-nav="history" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span>历史</span></a>
    <a class="tab" data-nav="settings" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg><span>设置</span></a>
  </nav>
</div></div></div>
<script src="mock.js"></script>
<script src="app.js"></script>
<script>document.getElementById('headDate').textContent = new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',weekday:'short'});</script>
</body>
</html>
