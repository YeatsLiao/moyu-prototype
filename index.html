<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>摸鱼战绩计算器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
<div class="stage"><div class="phone"><div class="screen">
  <main class="page">
    <div class="statusbar"><span>9:41</span><span class="capsule">摸鱼中 ···</span></div>

    <!-- HUD -->
    <div class="hud rise">
      <div class="lv-chip"><span id="homeLvIcon"></span><span id="homeLv">摸鱼新手</span></div>
      <div class="streak"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="0"><path d="M12 2c1 5-4 6-4 11a4 4 0 0 0 8 0c0-2-1-3-1-5 3 2 3 5 3 6a6 6 0 0 1-12 0c0-6 5-8 6-12z"/></svg><span id="streakNum">3</span>天</div>
    </div>
    <div class="xp rise"><i id="homeXp" style="width:0%"></i></div>

    <!-- 今日战绩 -->
    <div class="hero rise">
      <div class="dot-row"><span class="live-dot"></span><span class="t-lbl" id="liveLbl">今日</span></div>
      <div class="time" id="tTime">00:00:00</div>
      <div class="money" id="tMoney">¥ 0.00</div>
      <div class="eq" id="tEq">≈ <b>还差一点点就能换鸡腿</b></div>
      <div class="session-tag" id="sessionTag" style="display:none;"><span></span></div>
      <svg class="mascot" viewBox="0 0 120 84" fill="none" aria-hidden="true">
        <path d="M16 46 C20 28 50 20 74 30 C88 35 96 41 101 46 C96 52 86 60 70 63 C46 68 22 62 16 46 Z" fill="#FFE66D" stroke="#2A2723" stroke-width="3" stroke-linejoin="round"/>
        <path d="M99 46 L118 33 L112 46 L118 60 Z" fill="#FFE66D" stroke="#2A2723" stroke-width="3" stroke-linejoin="round"/>
        <path d="M52 40 l9 9 M61 40 l-9 9" stroke="#2A2723" stroke-width="3" stroke-linecap="round"/>
        <path d="M40 55 q7 6 14 0" stroke="#2A2723" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="36" cy="50" r="4" fill="#FF6B5B" opacity=".45"/>
      </svg>
    </div>

    <!-- 赛道 -->
    <div class="type-grid rise" id="typeGrid"></div>

    <div class="home-actions rise">
      <button class="btn-big btn-start" id="mainBtn">开始摸鱼</button>
      <button class="btn-ghost" id="btnEnd" style="display:none;">收工结算</button>
    </div>
  </main>

  <div class="modal-mask" id="settleModal">
    <div class="modal">
      <div class="tape"></div>
      <h3>今日结算</h3>
      <div class="m-time" id="mTime">00:00:00</div>
      <div class="m-money" id="mMoney">¥ 0.00</div>
      <div class="m-quip" id="mQuip"></div>
      <div class="m-actions">
        <button class="btn-big secondary" id="mClose">完成</button>
        <a class="btn-big btn-start" href="share.html">出战报</a>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab" data-nav="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg><span>首页</span></a>
    <a class="tab" data-nav="history" href="history.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span>历史</span></a>
    <a class="tab" data-nav="settings" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg><span>设置</span></a>
  </nav>
</div></div></div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
